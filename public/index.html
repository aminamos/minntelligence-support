<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — minntelligence</title>
<style>
body { margin:0 auto; padding:1rem; max-width:28em; font-family:"Times New Roman",Times,serif; font-size:20px; line-height:1.4; color:#1a1a1a; background:#f4f1ea; }
a { color:#0000ee; }
label { display:block; margin:0 0 .6rem; }
input, textarea { display:block; width:100%; box-sizing:border-box; font:inherit; padding:.4rem .6rem; border:1px solid #1a1a1a; border-radius:8px; background:#fff; margin-top:.2rem; }
textarea { min-height:7em; }
button { font:inherit; padding:.4rem 1rem; border:1px solid #1a1a1a; border-radius:8px; background:#fff; cursor:pointer; }
#status { margin-top:.8rem; }
#thread p { margin:0 0 .4rem; }
#thread .agent { color:#0078bf; }
</style>
</head>
<body>
<h1>Support</h1>
<p>Ask us anything. Leave your email so we can reply.</p>
<form id="form">
<label>Name (optional)<input id="name" autocomplete="name"></label>
<label>Email<input id="email" type="email" required autocomplete="email"></label>
<label>Subject (optional)<input id="subject"></label>
<label>Question<textarea id="body" required></textarea></label>
<button type="submit">Send</button>
</form>
<p id="status"></p>
<div id="thread-wrap" style="display:none">
<h2>Your conversation</h2>
<div id="thread"></div>
<form id="reply-form"><label>Reply<textarea id="reply-body"></textarea></label><button type="submit">Send</button></form>
</div>
<p><a href="https://minntelligence.fyi">minntelligence</a></p>
<script>
(function () {
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) { return null; }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var status = document.getElementById("status");
  try { document.getElementById("email").value = localStorage.getItem("support-email") || ""; } catch (e) {}
  function render(list) {
    document.getElementById("thread").innerHTML = list.map(function (m) {
      return '<p><strong class="' + esc(m.sender) + '">' + esc(m.sender) + ":</strong> " + esc(m.body) + "</p>";
    }).join("");
  }
  function poll() {
    var id = store("support-conversation-id"), key = store("support-visitor-key");
    if (!id || !key) return;
    fetch("/api/conversations/" + encodeURIComponent(id) + "?key=" + encodeURIComponent(key))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.messages) render(d.messages); })
      .catch(function () {});
  }
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var text = document.getElementById("body").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { status.textContent = "Drop your email so we can reply."; return; }
    if (!text) { status.textContent = "Write your question first."; return; }
    status.textContent = "Sending…";
    try { localStorage.setItem("support-email", email); } catch (err) {}
    fetch("/api/conversations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        body: text,
        name: document.getElementById("name").value.trim(),
        email: email,
        subject: document.getElementById("subject").value.trim(),
        key: store("support-visitor-key"),
      }),
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d || !d.id) { status.textContent = "Send failed. Try again."; return; }
      store("support-conversation-id", d.id);
      if (d.key) store("support-visitor-key", d.key);
      document.getElementById("form").style.display = "none";
      document.getElementById("thread-wrap").style.display = "block";
      status.textContent = "Sent. We reply by email, or watch here.";
      poll();
      setInterval(poll, 5000);
    }).catch(function () { status.textContent = "Send failed. Try again."; });
  });
  document.getElementById("reply-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = store("support-conversation-id"), key = store("support-visitor-key");
    var inp = document.getElementById("reply-body");
    var text = inp.value.trim();
    if (!text || !id) return;
    inp.value = "";
    fetch("/api/conversations/" + encodeURIComponent(id) + "/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, body: text }),
    }).then(function () { poll(); }).catch(function () {});
  });
  if (store("support-conversation-id")) {
    document.getElementById("form").style.display = "none";
    document.getElementById("thread-wrap").style.display = "block";
    poll();
    setInterval(poll, 5000);
  }
})();
</script>
</body>
</html>
